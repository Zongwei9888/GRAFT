name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python scripts/run_tests.py
      - name: Check synchronized plugin and release metadata
        run: python scripts/check_release.py
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/graft-smoke"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$RUNNER_TEMP/graft-smoke/Scripts/python.exe" -m pip install dist/*.whl
            "$RUNNER_TEMP/graft-smoke/Scripts/graft.exe" --version
          else
            "$RUNNER_TEMP/graft-smoke/bin/python" -m pip install dist/*.whl
            "$RUNNER_TEMP/graft-smoke/bin/graft" --version
          fi
